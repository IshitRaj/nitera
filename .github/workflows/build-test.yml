name: Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # The job id is also the status-check context, and `main` requires a
    # check called `build`. Adding a `name:` here would rename that context
    # and the required check would stop matching, so this job keeps its
    # default name on purpose.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    # Windows support is SECURITY-AUDIT item 3 and is still open: the policy
    # grammar splits patterns on `/` and normalizes to a leading `/`, which
    # does not match a `\`-separated path, so 21 pre-existing matcher and
    # path tests fail there. The job is reported but does not block, so the
    # failure stays visible and the job turns green on its own once item 3
    # lands. Remove this line then. Everything here compiles and runs on
    # Windows; only the path-matching expectations fail.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
