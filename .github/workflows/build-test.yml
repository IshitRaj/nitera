name: Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # The job id is also the status-check context, and `main` requires a
    # check called `build`. Adding a `name:` here would rename that context
    # and the required check would stop matching, so this job keeps its
    # default name on purpose.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  windows:
    name: Build & test (Windows)
    runs-on: windows-latest

    # A real blocking check. Path matching now works in a single `/` policy
    # string form for both patterns and request paths, and the root or drive
    # prefix is detected from the text rather than from `Path::is_absolute`,
    # which reports false for a `/`-rooted path on Windows. See
    # SECURITY-AUDIT.md item 3.
    #
    # Windows does not set `HOME`, and the library requires it for every path
    # (SECURITY-AUDIT item 13, still open). The job supplies it so the suite has
    # the same environment Unix has. This is test infrastructure only; no
    # library behavior changes. The alternative, letting each test set the
    # variable itself, races across the parallel test threads.
    env:
      HOME: C:\Users\runneradmin

    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
