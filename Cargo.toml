[package]
name = "nitera"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "A zero-dependency policy engine that permission-gates filesystem, process, and network access"
repository = "https://github.com/IshitRaj/nitera"
readme = "README.md"
keywords = ["security", "sandbox", "permissions", "policy"]
categories = ["filesystem"]
include = [
    "src/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE*",
    "Cargo.toml",
]

[[bench]]
name = "policy_check"
harness = false

[dependencies]
